<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 88px; line-height: 0.92; text-transform: uppercase; color: #FFFFFF;">Mentions légales<br><span style="color: #E7604F;">&amp; confidentialité.</span></h1>
<p style="margin: 0; max-width: 640px; font-size: 19px; line-height: 1.55; color: #D8DCDA;">Qui a créé ce site, comment il est hébergé et ce que deviendraient tes données si Élan existait vraiment.</p>
</section>
<div style="height: 64px; flex-shrink: 0; background: #E7604F; display: flex; align-items: center; justify-content: center; gap: 48px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; color: #1B242D;">Dynamique</span><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #1B242D;"></span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; color: #1B242D;">Urbaine</span><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #1B242D;"></span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; color: #1B242D;">Polyvalente</span><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #1B242D;"></span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; color: #1B242D;">Motivante</span></div>
<div style="padding: 72px 80px 104px; display: flex; justify-content: center;"><div style="width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 72px;"><div style="background: #E7604F; border-radius: 16px; padding: 36px 40px; display: flex; flex-direction: column; gap: 14px;"><div style="display: flex; align-items: center; gap: 12px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B242D" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7.5v.5"></path></svg><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; color: #1B242D;">Site fictif, projet pédagogique</span></div><p style="margin: 0; font-size: 18px; line-height: 1.6; color: #1B242D;">Élan est une salle de sport <strong>imaginaire</strong>. Ce site a été conçu par Studio Nova dans le cadre de la formation Chef de projet digital de Digital Campus Paris (2026).</p><p style="margin: 0; font-size: 18px; line-height: 1.6; color: #1B242D;">Aucun service n’est vendu, aucune réservation n’est enregistrée et aucune donnée saisie dans les formulaires n’est transmise ni conservée. L’adresse, les horaires, les tarifs, les coachs et les coordonnées sont inventés pour rendre la maquette réaliste.</p></div><section style="display: flex; flex-direction: column; gap: 36px;"><h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 1; text-transform: uppercase; color: #FFFFFF;">Mentions légales</h2><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Éditeur du site</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Studio Nova, équipe étudiante composée de Malgorzata Kieliszek, Mahsa Moumeni et Guerdie.</p><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Projet réalisé dans le cadre de la formation Chef de projet digital de Digital Campus Paris (2026). Projet pédagogique non commercial, sans immatriculation ni numéro SIRET.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Cliente du projet</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Élan, studio multi-activités fondé par Debbie Scotto. La salle et sa fondatrice sont des personnages fictifs, imaginés pour le cas pratique.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Hébergement</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Cette maquette est publiée sur la plateforme Claude d’Anthropic (San Francisco, États-Unis) pour la démonstration. La version WordPress du projet est en ligne à l’adresse hansell.fr/sport.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Propriété intellectuelle</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Le nom Élan, le logo et la charte graphique « Énergie urbaine » ont été créés pour ce projet par Studio Nova. Les photographies sont utilisées à titre d’illustration, dans un cadre pédagogique et non commercial, et ne peuvent pas être réutilisées.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Responsabilité</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Les informations présentées sur ce site (adresse, horaires, tarifs, coachs, coordonnées) sont fictives. Elles ne doivent pas être utilisées pour réserver un cours, contacter le studio ou se rendre à une adresse. Toute ressemblance avec une salle de sport existante serait fortuite.</p></div></section><section style="display: flex; flex-direction: column; gap: 36px;"><h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 1; text-transform: uppercase; color: #FFFFFF;">Politique de confidentialité</h2><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Cette politique présente la façon dont Élan traiterait vos données personnelles si le studio existait, conformément au Règlement général sur la protection des données (RGPD). Sur ce site fictif, aucune donnée n’est réellement collectée : le formulaire de contact n’envoie et n’enregistre rien.</p><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Données concernées</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Via le formulaire de contact : nom, prénom, adresse e-mail, numéro de téléphone, objet et contenu du message.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Pourquoi ces données ?</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Pour répondre à vos demandes (séance d’essai, abonnement, questions) et gérer vos réservations de cours.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Base légale</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Votre consentement, donné en cochant la case du formulaire, et l’exécution de votre contrat si vous êtes abonné·e.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Durée de conservation</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">3 ans après votre dernier contact si vous n’êtes pas client·e, puis suppression. Pour les abonné·es, pendant toute la durée de l’abonnement.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Qui y a accès ?</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Uniquement l’équipe d’Élan. Vos données ne sont jamais vendues ni cédées à des tiers.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Vos droits</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Vous pouvez demander à accéder à vos données, les corriger, les effacer, vous opposer à leur utilisation, en limiter le traitement ou les récupérer (portabilité). Il suffirait d’écrire à contact@studio-elan.fr (adresse fictive). En cas de désaccord, vous pouvez adresser une réclamation à la CNIL, sur cnil.fr.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Cookies</h3><p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Élan ne dépose aucun cookie publicitaire ni de mesure d’audience.</p></div><p style="margin: 0; font-size: 14px; color: #D8DCDA;">Dernière mise à jour : 26 septembre 2026.</p></section></div></div>

<p role="heading" aria-level="1" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 50px; line-height: 0.95; text-transform: uppercase; color: #FFFFFF;">Mentions légales <span style="color: #E7604F;">&amp; confidentialité.</span></p>

<div style="flex-shrink: 0; background: #E7604F; padding: 14px 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: #1B242D;">Dynamique</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: #1B242D;">Urbaine</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: #1B242D;">Polyvalente</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: #1B242D;">Motivante</span></div>
<div style="padding: 32px 20px 56px; display: flex; flex-direction: column; gap: 52px;"><div style="background: #E7604F; border-radius: 16px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px;"><div style="display: flex; align-items: center; gap: 12px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B242D" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7.5v.5"></path></svg><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; color: #1B242D;">Site fictif, projet pédagogique</span></div><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B242D;">Élan est une salle de sport <strong>imaginaire</strong>. Ce site a été conçu par Studio Nova dans le cadre de la formation Chef de projet digital de Digital Campus Paris (2026).</p><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B242D;">Aucun service n’est vendu, aucune réservation n’est enregistrée et aucune donnée saisie dans les formulaires n’est transmise ni conservée. L’adresse, les horaires, les tarifs, les coachs et les coordonnées sont inventés pour rendre la maquette réaliste.</p></div><section style="display: flex; flex-direction: column; gap: 28px;"><h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; color: #FFFFFF;">Mentions légales</h2><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Éditeur du site</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Studio Nova, équipe étudiante composée de Malgorzata Kieliszek, Mahsa Moumeni et Guerdie.</p><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Projet réalisé dans le cadre de la formation Chef de projet digital de Digital Campus Paris (2026). Projet pédagogique non commercial, sans immatriculation ni numéro SIRET.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Cliente du projet</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Élan, studio multi-activités fondé par Debbie Scotto. La salle et sa fondatrice sont des personnages fictifs, imaginés pour le cas pratique.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Hébergement</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Cette maquette est publiée sur la plateforme Claude d’Anthropic (San Francisco, États-Unis) pour la démonstration. La version WordPress du projet est en ligne à l’adresse hansell.fr/sport.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Propriété intellectuelle</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Le nom Élan, le logo et la charte graphique « Énergie urbaine » ont été créés pour ce projet par Studio Nova. Les photographies sont utilisées à titre d’illustration, dans un cadre pédagogique et non commercial, et ne peuvent pas être réutilisées.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Responsabilité</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Les informations présentées sur ce site (adresse, horaires, tarifs, coachs, coordonnées) sont fictives. Elles ne doivent pas être utilisées pour réserver un cours, contacter le studio ou se rendre à une adresse. Toute ressemblance avec une salle de sport existante serait fortuite.</p></div></section><section style="display: flex; flex-direction: column; gap: 28px;"><h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; color: #FFFFFF;">Politique de confidentialité</h2><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Cette politique présente la façon dont Élan traiterait vos données personnelles si le studio existait, conformément au Règlement général sur la protection des données (RGPD). Sur ce site fictif, aucune donnée n’est réellement collectée : le formulaire de contact n’envoie et n’enregistre rien.</p><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Données concernées</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Via le formulaire de contact : nom, prénom, adresse e-mail, numéro de téléphone, objet et contenu du message.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Pourquoi ces données ?</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Pour répondre à vos demandes (séance d’essai, abonnement, questions) et gérer vos réservations de cours.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Base légale</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Votre consentement, donné en cochant la case du formulaire, et l’exécution de votre contrat si vous êtes abonné·e.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Durée de conservation</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">3 ans après votre dernier contact si vous n’êtes pas client·e, puis suppression. Pour les abonné·es, pendant toute la durée de l’abonnement.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Qui y a accès ?</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Uniquement l’équipe d’Élan. Vos données ne sont jamais vendues ni cédées à des tiers.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Vos droits</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Vous pouvez demander à accéder à vos données, les corriger, les effacer, vous opposer à leur utilisation, en limiter le traitement ou les récupérer (portabilité). Il suffirait d’écrire à contact@studio-elan.fr (adresse fictive). En cas de désaccord, vous pouvez adresser une réclamation à la CNIL, sur cnil.fr.</p></div><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; text-transform: uppercase; color: #F2A597;">Cookies</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #D8DCDA;">Élan ne dépose aucun cookie publicitaire ni de mesure d’audience.</p></div><p style="margin: 0; font-size: 14px; color: #D8DCDA;">Dernière mise à jour : 26 septembre 2026.</p></section></div>
