<section style="padding: 72px 80px 96px; display: flex; flex-direction: column; gap: 32px;"><article style="display: flex; flex-direction: row; background: #243140; border-radius: 20px; overflow: hidden; min-height: 400px;"><div style="position: relative; width: 46%; flex-shrink: 0; background: #26323E; overflow: hidden;"><img src="images/img-d5bf677f.jpg" alt="Bol de quinoa, poulet grillé, avocat, pois chiches et légumes verts, à côté d’haltères et d’une gourde d’eau" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 55%;"></div><div style="padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; gap: 18px;"><div style="display: flex; align-items: center; gap: 16px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 1; color: #E7604F;">01</span><span style="background: #E7604F; color: #1B242D; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px;">Nutrition</span><span style="font-size: 15px; font-weight: 600; color: #F2A597;">27 septembre 2026</span></div><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase; color: #FFFFFF;">Nouveau : le cours de nutrition, comment bien manger</h3><p style="margin: 0; max-width: 600px; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Le sport fait la moitié du travail, l’assiette fait le reste. Élan lance un cours de nutrition avec notre diététicienne diplômée : en petit groupe, tu apprends à composer des repas simples, qui te donnent de l’énergie pour tes séances et t’aident à mieux récupérer. Pas de régime, pas d’interdit : des repères concrets pour manger mieux au quotidien.</p><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;"><li style="display: flex; align-items: flex-start; gap: 10px; font-size: 16px; line-height: 1.5; color: #D8DCDA;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E7604F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M5 12l5 5 9-10"></path></svg><span><strong style="color: #FFFFFF;">Avant la séance :</strong> un repas léger 2 à 3 h avant, ou un fruit si tu t’entraînes tôt le matin.</span></li><li style="display: flex; align-items: flex-start; gap: 10px; font-size: 16px; line-height: 1.5; color: #D8DCDA;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E7604F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M5 12l5 5 9-10"></path></svg><span><strong style="color: #FFFFFF;">Après la séance :</strong> une assiette complète : protéines, féculents complets et légumes, comme ce bol quinoa, poulet et pois chiches.</span></li><li style="display: flex; align-items: flex-start; gap: 10px; font-size: 16px; line-height: 1.5; color: #D8DCDA;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E7604F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M5 12l5 5 9-10"></path></svg><span><strong style="color: #FFFFFF;">Toute la journée :</strong> bois de l’eau régulièrement et garde une gourde avec toi pendant le cours.</span></li></ul><div style="display: flex; align-items: center; gap: 8px 20px; font-size: 14px; color: #D8DCDA; flex-wrap: wrap;"><span style="display: flex; align-items: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>45 min</span><span>35 € la séance</span><span>1re consultation offerte aux abonné·es</span></div><a href="contact.html" style="align-self: flex-start; background: #E7604F; color: #1B242D; min-height: 52px; padding: 0 28px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; text-decoration: none;">Prendre rendez-vous <span aria-hidden="true">→</span></a></div></article><article style="display: flex; flex-direction: row-reverse; background: #243140; border-radius: 20px; overflow: hidden; min-height: 400px;"><div style="position: relative; width: 46%; flex-shrink: 0; background: #26323E; overflow: hidden;"><img loading="lazy" decoding="async" src="images/img-5acad0f2.jpg" alt="Illustration de l’article" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%;"></div><div style="padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; gap: 18px;"><div style="display: flex; align-items: center; gap: 16px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 1; color: #E7604F;">02</span><span style="background: #E7604F; color: #1B242D; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px;">Événement</span><span style="font-size: 15px; font-weight: 600; color: #F2A597;">18 septembre 2026</span></div><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase; color: #FFFFFF;">Portes ouvertes au studio</h3><p style="margin: 0; max-width: 560px; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Le samedi 10 octobre 2026, Élan organise une journée portes ouvertes. Viens tester gratuitement un cours de boxe avec Gocha : échauffement, techniques de base et travail au sac, dans une ambiance motivante. Tu pourras aussi visiter le studio et poser toutes tes questions à l’équipe. Aucun équipement n’est nécessaire, on te prête les gants.</p></div></article><article style="display: flex; flex-direction: row; background: #243140; border-radius: 20px; overflow: hidden; min-height: 400px;"><div style="position: relative; width: 46%; flex-shrink: 0; background: #26323E; overflow: hidden;"><img loading="lazy" decoding="async" src="images/img-36afb77a.jpg" alt="Illustration de l’article" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%;"></div><div style="padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; gap: 18px;"><div style="display: flex; align-items: center; gap: 16px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 1; color: #E7604F;">03</span><span style="background: #E7604F; color: #1B242D; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px;">HIIT</span><span style="font-size: 15px; font-weight: 600; color: #F2A597;">15 septembre 2026</span></div><h3 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase; color: #FFFFFF;">Le HIIT express du midi</h3><p style="margin: 0; max-width: 560px; font-size: 17px; line-height: 1.65; color: #D8DCDA;">Nouveau créneau à midi : Masha te propose 30 minutes de HIIT pour te défouler pendant ta pause déjeuner. Des exercices courts et intenses, enchaînés en circuit, pour brûler un maximum d’énergie en peu de temps. Le cours s’adapte à ton niveau et tu repars au travail plein d’énergie. Rendez-vous du lundi au vendredi à 12h15.</p></div></article></section>
